<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Equistasi Point · Novità (ufficio)</title>
  <!-- Pagina per l'ufficio: gestisce le novità che compaiono nell'app (tabella Supabase «news», immagini nel bucket «news»).
       Accesso con l'account Supabase dell'ufficio; può scrivere solo chi è in news_editors. Non entra nelle app per iPhone/Android. -->
  <style>
    :root { --navy: #23266f; --blue: #1e6bff; --red: #c8372d; --bg: #f3f5fa; --card: #fff; --txt: #161a33; --muted: #5d6480; --border: #e1e5ef; --ok: #1d7a46; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--navy); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header .who { font-size: .85rem; opacity: .85; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .muted { color: var(--muted); font-size: .9rem; }
    .err { color: var(--red); } .okmsg { color: var(--ok); }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 12px 0 4px; }
    input[type=text], input[type=email], input[type=password], input[type=url], input[type=datetime-local], textarea {
      width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
    textarea { min-height: 130px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-weight: 400; }
    .checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; margin: 0; }
    button, .btn { font: inherit; padding: 9px 16px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--txt); cursor: pointer; text-decoration: none; display: inline-block; }
    button.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
    button.danger { color: var(--red); border-color: #f0c9c5; }
    button:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
    .list-item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .list-item:last-child { border-bottom: 0; }
    .list-item img, .list-item .ph { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; background: #eef1fb; }
    .list-item b { display: block; }
    .list-item.sel { background: #eef1fb; border-radius: 10px; padding-left: 8px; }
    .badge { display: inline-block; font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 4px; }
    .b-pub { background: #dff3e7; color: var(--ok); } .b-draft { background: #eef1fb; color: var(--muted); } .b-exp { background: #fde7e5; color: var(--red); } .b-wait { background: #fff3e6; color: #8a4300; }
    .preview { max-width: 380px; }
    .preview .pcard { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: 0 6px 20px rgba(22,26,51,.06); }
    .preview img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; margin-bottom: 8px; }
    .preview h3 { margin: 4px 0 6px; } .preview p { white-space: pre-line; margin: 0 0 10px; }
    .preview .pbtn { display: inline-block; background: var(--navy); color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 600; }
    .note { background: #fff3e6; color: #8a4300; border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin-top: 12px; }
    .imgbox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .imgbox img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; }
    #login { max-width: 420px; margin: 40px auto; }
    @media (max-width: 800px) { .layout, .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header><h1>Equistasi Point · Novità</h1><div class="who" id="who"></div></header>
<main>
  <div class="card" id="login" hidden>
    <h2 style="margin-top:0">Accesso ufficio</h2>
    <p class="muted">Entra con l'account dell'ufficio per gestire le novità che compaiono nell'app.</p>
    <form id="login-f">
      <label for="em">Email</label><input type="email" id="em" autocomplete="username" required />
      <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required />
      <div class="actions"><button class="primary">Entra</button></div>
      <p id="login-msg" class="err"></p>
    </form>
  </div>

  <div id="panel" hidden>
    <div class="layout">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <h2 style="margin:0">Novità</h2><button class="primary" id="new">+ Nuova</button>
        </div>
        <div id="list" style="margin-top:8px"></div>
      </div>
      <div>
        <form class="card" id="ed">
          <h2 style="margin:0" id="ed-title">Nuova novità</h2>
          <label for="f-title">Titolo *</label><input type="text" id="f-title" maxlength="140" required />
          <label for="f-body">Testo</label><textarea id="f-body" maxlength="2000"></textarea>
          <label>Immagine</label>
          <div class="imgbox"><img id="f-img" alt="" hidden /><input type="file" id="f-file" accept="image/*" /><button type="button" id="f-noimg" hidden>Togli immagine</button></div>
          <div class="row">
            <div><label for="f-link">Link (https://…)</label><input type="url" id="f-link" placeholder="https://www.instagram.com/p/…" /></div>
            <div><label for="f-label">Testo del pulsante</label><input type="text" id="f-label" maxlength="40" placeholder="Guarda il post" /></div>
          </div>
          <label>Chi la vede</label>
          <div class="checks" id="f-aud">
            <label><input type="checkbox" value="all" checked /> Tutti</label>
            <label><input type="checkbox" value="silicon" /> Silicon</label>
            <label><input type="checkbox" value="gel" /> Gel</label>
            <label><input type="checkbox" value="prof" /> Noleggio prof</label>
            <label><input type="checkbox" value="rent" /> Noleggio privato</label>
          </div>
          <div class="row">
            <div><label for="f-from">Visibile dal</label><input type="datetime-local" id="f-from" /></div>
            <div><label for="f-to">Scade il (facoltativo)</label><input type="datetime-local" id="f-to" /></div>
          </div>
          <label class="checks" style="margin-top:14px"><input type="checkbox" id="f-pub" /> <b>Pubblicata</b> (se non spuntata resta una bozza, nell'app non si vede)</label>
          <div class="note">Ricorda: nell'app vanno solo contenuti adatti ai pazienti. Niente promesse di guarigione o risultati medici.</div>
          <div class="actions">
            <button class="primary" id="save">Salva</button>
            <button type="button" class="danger" id="del" hidden>Elimina</button>
          </div>
          <p id="ed-msg"></p>
        </form>
        <div class="card preview">
          <div class="muted" style="margin-bottom:8px">Anteprima nell'app</div>
          <div class="pcard" id="pv"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  var SB = 'https://lxnntieqcumhjnvfbbgu.supabase.co';
  var KEY = 'sb_publishable_TYFg4ICPgE_FSTCCYPf4Zg_AyvuPXrO';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var AUD = { all: 'Tutti', silicon: 'Silicon', gel: 'Gel', prof: 'Noleggio prof', rent: 'Noleggio privato' };
  var sess = null, items = [], cur = null, newImg = null, imgUrl = '';

  // ── sessione (solo per questa scheda del browser) ──
  function loadSess() { try { sess = JSON.parse(sessionStorage.getItem('eq-admin') || 'null'); } catch (e) { sess = null; } }
  function saveSess(s) { sess = s; try { if (s) sessionStorage.setItem('eq-admin', JSON.stringify(s)); else sessionStorage.removeItem('eq-admin'); } catch (e) {} }
  async function auth(grant, body) {
    var r = await fetch(SB + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || 'login');
    saveSess({ at: d.access_token, rt: d.refresh_token, exp: Date.now() + (d.expires_in || 3600) * 1000, email: (d.user && d.user.email) || '' });
  }
  async function token() {
    if (!sess) throw new Error('auth');
    if (Date.now() > sess.exp - 60000) await auth('refresh_token', { refresh_token: sess.rt });
    return sess.at;
  }
  async function api(path, opt) {
    opt = opt || {};
    var h = Object.assign({ apikey: KEY, Authorization: 'Bearer ' + await token() }, opt.headers || {});
    var r = await fetch(SB + path, Object.assign({}, opt, { headers: h, cache: 'no-store' }));
    if (r.status === 401) { logout(); throw new Error('auth'); }
    var txt = await r.text(); var d = null; try { d = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) throw new Error((d && (d.message || d.error)) || ('HTTP ' + r.status));
    return d;
  }

  function logout() { saveSess(null); $('panel').hidden = true; $('login').hidden = false; $('who').innerHTML = ''; }
  async function start() {
    $('login').hidden = true; $('panel').hidden = false;
    $('who').innerHTML = esc(sess.email) + ' · <a href="#" id="out" style="color:#fff">Esci</a>';
    $('out').onclick = function (e) { e.preventDefault(); logout(); };
    var ok = await api('/rest/v1/rpc/is_news_editor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(function () { return false; });
    if (!ok) { $('panel').innerHTML = '<div class="card"><h2 style="margin-top:0">Account non abilitato</h2><p>Questo account non può gestire le novità. Chiedi di essere aggiunto all\'elenco dell\'ufficio.</p></div>'; return; }
    await loadList(); edit(null);
  }

  $('login-f').addEventListener('submit', async function (e) {
    e.preventDefault(); $('login-msg').textContent = '';
    try { await auth('password', { email: $('em').value.trim(), password: $('pw').value }); $('pw').value = ''; start(); }
    catch (err) { $('login-msg').textContent = 'Email o password non corretti.'; }
  });

  // ── elenco ──
  function status(n) {
    var now = Date.now();
    if (!n.published) return '<span class="badge b-draft">Bozza</span>';
    if (n.expires_at && new Date(n.expires_at).getTime() <= now) return '<span class="badge b-exp">Scaduta</span>';
    if (new Date(n.publish_at).getTime() > now) return '<span class="badge b-wait">Programmata</span>';
    return '<span class="badge b-pub">Pubblicata</span>';
  }
  var dt = function (t) { return t ? new Date(t).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; };
  async function loadList() {
    items = await api('/rest/v1/news?select=*&order=publish_at.desc&limit=200') || [];
    $('list').innerHTML = items.length ? items.map(function (n) {
      return '<div class="list-item' + (cur && cur.id === n.id ? ' sel' : '') + '" data-id="' + n.id + '">' + (n.image_url ? '<img src="' + esc(n.image_url) + '" alt="" />' : '<div class="ph"></div>') +
        '<div><b>' + esc(n.title) + '</b><span class="muted">' + status(n) + dt(n.publish_at) + ' · ' + (n.audience || []).map(function (a) { return AUD[a] || a; }).join(', ') + '</span></div></div>';
    }).join('') : '<p class="muted">Nessuna novità. Crea la prima con «+ Nuova».</p>';
  }
  $('list').addEventListener('click', function (e) {
    var el = e.target.closest('.list-item'); if (!el) return;
    edit(items.find(function (n) { return n.id === el.dataset.id; }) || null); loadList();
  });
  $('new').onclick = function () { edit(null); loadList(); };

  // ── modulo ──
  var local = function (t) { if (!t) return ''; var d = new Date(t); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
  function audSet(list) { [].forEach.call($('f-aud').querySelectorAll('input'), function (c) { c.checked = list.indexOf(c.value) >= 0; }); }
  function audGet() { var v = [].filter.call($('f-aud').querySelectorAll('input'), function (c) { return c.checked; }).map(function (c) { return c.value; }); return v.indexOf('all') >= 0 || !v.length ? ['all'] : v; }
  $('f-aud').addEventListener('change', function (e) {
    if (e.target.value === 'all' && e.target.checked) audSet(['all']);
    else if (e.target.value !== 'all' && e.target.checked) $('f-aud').querySelector('input[value=all]').checked = false;
    preview();
  });
  function edit(n) {
    cur = n; newImg = null; imgUrl = n ? n.image_url : '';
    $('ed-title').textContent = n ? 'Modifica novità' : 'Nuova novità';
    $('f-title').value = n ? n.title : ''; $('f-body').value = n ? n.body : '';
    $('f-link').value = n ? n.link_url : ''; $('f-label').value = n ? n.link_label : '';
    audSet(n ? n.audience : ['all']);
    $('f-from').value = local(n ? n.publish_at : new Date()); $('f-to').value = local(n && n.expires_at);
    $('f-pub').checked = n ? n.published : false; $('f-file').value = '';
    $('del').hidden = !n; $('ed-msg').textContent = ''; showImg(); preview();
  }
  function showImg() { var src = newImg ? newImg.url : imgUrl; $('f-img').hidden = !src; if (src) $('f-img').src = src; $('f-noimg').hidden = !src; }
  $('f-noimg').onclick = function () { newImg = null; imgUrl = ''; $('f-file').value = ''; showImg(); preview(); };

  // immagine rimpicciolita (max 1600 px, JPEG) prima del caricamento
  $('f-file').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var img = new Image(); var u = URL.createObjectURL(f);
    img.onload = function () {
      var s = Math.min(1, 1600 / Math.max(img.width, img.height)); var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { newImg = { blob: b, url: URL.createObjectURL(b) }; URL.revokeObjectURL(u); showImg(); preview(); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { $('ed-msg').className = 'err'; $('ed-msg').textContent = 'Immagine non leggibile.'; };
    img.src = u;
  });

  function preview() {
    var src = newImg ? newImg.url : imgUrl; var link = $('f-link').value.trim();
    $('pv').innerHTML = (src ? '<img src="' + esc(src) + '" alt="" />' : '') + '<div class="muted"><span class="badge b-exp">Nuovo</span></div>' +
      '<h3>' + esc($('f-title').value || 'Titolo') + '</h3>' + ($('f-body').value ? '<p>' + esc($('f-body').value) + '</p>' : '') +
      (link ? '<span class="pbtn">' + esc($('f-label').value || 'Scopri di più') + ' ›</span>' : '');
  }
  ['f-title', 'f-body', 'f-link', 'f-label'].forEach(function (id) { $(id).addEventListener('input', preview); });

  $('ed').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = $('ed-msg'); msg.className = 'muted'; msg.textContent = 'Salvataggio…'; $('save').disabled = true;
    try {
      var link = $('f-link').value.trim();
      if (link && !/^https:\/\//i.test(link)) throw new Error('Il link deve iniziare con https://');
      var url = imgUrl;
      if (newImg) {
        var name = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + '.jpg';
        await api('/storage/v1/object/news/' + name, { method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }, body: newImg.blob });
        url = SB + '/storage/v1/object/public/news/' + name;
      }
      var to = $('f-to').value;
      var row = { title: $('f-title').value.trim(), body: $('f-body').value.trim(), image_url: url || '', link_url: link, link_label: $('f-label').value.trim(),
        audience: audGet(), published: $('f-pub').checked,
        publish_at: $('f-from').value ? new Date($('f-from').value).toISOString() : new Date().toISOString(), expires_at: to ? new Date(to).toISOString() : null };
      var saved = cur
        ? await api('/rest/v1/news?id=eq.' + cur.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' }, body: JSON.stringify(row) })
        : await api('/rest/v1/news', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' }, body: JSON.stringify(row) });
      cur = saved && saved[0]; await loadList(); edit(cur);
      msg.className = 'okmsg'; msg.textContent = row.published ? 'Salvata e pubblicata: nell\'app compare entro un\'ora.' : 'Salvata come bozza.';
    } catch (err) { msg.className = 'err'; msg.textContent = 'Non salvata: ' + err.message; }
    $('save').disabled = false;
  });

  $('del').onclick = async function () {
    if (!cur || !confirm('Eliminare questa novità? Sparisce anche dall\'app.')) return;
    try {
      await api('/rest/v1/news?id=eq.' + cur.id, { method: 'DELETE' });
      var m = (cur.image_url || '').match(/\/object\/public\/news\/([^?]+)$/);
      if (m) await api('/storage/v1/object/news/' + m[1], { method: 'DELETE' }).catch(function () {});
      await loadList(); edit(null);
    } catch (err) { $('ed-msg').className = 'err'; $('ed-msg').textContent = 'Non eliminata: ' + err.message; }
  };

  loadSess(); if (sess) start().catch(logout); else logout();
})();
</script>
</body>
</html>
