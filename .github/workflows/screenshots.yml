# Prepara la nuova versione su App Store Connect e ne sostituisce gli screenshot (iPhone e iPad).
# Si avvia a mano: GitHub → Actions → "App Store: screenshot" → Run workflow.
name: "App Store: screenshot"

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Link allo zip con le cartelle iphone/ e ipad/"
        required: true
        default: "https://d2ol7oe51mr4n9.cloudfront.net/user_3DOukuRyFd7f2J84gGwrmduEdRX/c5eb419e-0347-45f5-977a-9051cea6adfd.zip"
      whats_new:
        description: "Testo «Novità di questa versione»"
        required: false
        default: "Nuova versione di Equistasi Point: mappa del corpo più chiara con i trigger point, video tutorial verticali per Equistasi gel e silicone, protocolli PDF che si aprono dentro l'app, promemoria delle 2 ore e promemoria giornalieri, nuova sezione Sport con test per misurare i progressi, nuova grafica con i colori Equistasi."

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chiave API di App Store Connect
        env:
          S_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          S_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          KEY_ID=$(printf '%s' "$S_KEY_ID" | tr -d '[:space:]'); ISSUER_ID=$(printf '%s' "$S_ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$KEY_ID"; echo "::add-mask::$ISSUER_ID"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/key.p8"
          { echo "KEY_ID=$KEY_ID"; echo "ISSUER_ID=$ISSUER_ID"; echo "KEY_PATH=$RUNNER_TEMP/key.p8"; } >> "$GITHUB_ENV"
          pip install --quiet pyjwt cryptography

      - name: Scarica gli screenshot
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          curl -sfL "$ZIP_URL" -o "$RUNNER_TEMP/shots.zip"
          unzip -q "$RUNNER_TEMP/shots.zip" -d "$RUNNER_TEMP/shots"
          find "$RUNNER_TEMP/shots" -name '*.png' | sort

      - name: Aggiorna la versione su App Store Connect
        env:
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          P=mobile/ios/App/App.xcodeproj/project.pbxproj
          BUNDLE=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' $P | sed 's/.*= *//; s/;//')
          VERSION=$(grep -m1 'MARKETING_VERSION' $P | sed 's/[^0-9.]//g')
          cd .github/scripts && python3 asc_screenshots.py "$BUNDLE" "$VERSION" "$RUNNER_TEMP/shots" "$WHATS_NEW"
