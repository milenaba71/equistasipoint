# Prepara la versione su App Store Connect per la revisione Apple: collega la build,
# rilascio manuale, contatti e note per i revisori. NON invia: l'invio si fa da App Store Connect.
name: "App Store: prepara revisione"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione (vuoto = quella del progetto, es. 1.2.1)"
        required: false
        default: ""
      build:
        description: "Numero di build da collegare (es. 33)"
        required: true
        default: "54"
      notes:
        description: "Note per i revisori Apple"
        required: true
        default: "L’app richiede il codice del dispositivo Equistasi. Codice di prova: DEMO2026. Nella prima schermata tocca il riquadro «Clicca qui e abbina il dispositivo»: la fotocamera serve solo per leggere il codice sul dispositivo fisico. Se non legge nessun codice (o se neghi la fotocamera), dopo 10 secondi compare il campo «Scrivi qui il codice»: scrivi DEMO2026 e tocca «Abbina». Dopo l’abbinamento parte un breve video tutorial con il pulsante «Salta»; poi scegli un profilo (es. Dolore), spunta «Accetto ed entro» e tocca «Continua». Video e attivazione richiedono internet. Il link Shop apre il negozio online dei dispositivi fisici Equistasi (shop.equistasi.com). / The app requires the code of the Equistasi device. Demo code: DEMO2026. On the first screen tap the box «Clicca qui e abbina il dispositivo» (the camera is only used to read the code on the physical device). If no code is read (or camera access is denied), after 10 seconds the field «Scrivi qui il codice» appears: type DEMO2026 and tap «Abbina». A short tutorial with a «Skip» button follows; then choose a profile, tick «Accetto ed entro» and tap «Continua». Videos and activation need an internet connection."
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chiave API di App Store Connect
        env:
          S_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          S_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          KEY_ID=$(printf '%s' "$S_KEY_ID" | tr -d '[:space:]'); ISSUER_ID=$(printf '%s' "$S_ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$KEY_ID"; echo "::add-mask::$ISSUER_ID"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/key.p8"
          { echo "KEY_ID=$KEY_ID"; echo "ISSUER_ID=$ISSUER_ID"; echo "KEY_PATH=$RUNNER_TEMP/key.p8"; } >> "$GITHUB_ENV"
          pip install --quiet pyjwt cryptography

      - name: Prepara la versione
        env:
          REVIEW_NOTES: ${{ inputs.notes }}
          BUILD: ${{ inputs.build }}
          CONTACT_FIRST: Milena
          CONTACT_LAST: Baroni
          CONTACT_PHONE: "+39 3355849343"
          CONTACT_EMAIL: info@equistasi.com
          WHATS_NEW_IT: "• Le sezioni dell’app si aprono in base al tipo di dispositivo Equistasi abbinato\n• Abbinamento del dispositivo più semplice\n• Programma di esercizi posturali con i disegni e report PDF più completo\n• Shop sempre a portata di mano, anche prima dell’abbinamento\n• Piccoli miglioramenti e correzioni"
          WHATS_NEW_EN: "• App sections open according to the type of paired Equistasi device\n• Simpler device pairing\n• Postural exercise programme with drawings and a more complete PDF report\n• Shop always at hand, even before pairing\n• Minor improvements and fixes"
        run: |
          P=mobile/ios/App/App.xcodeproj/project.pbxproj
          BUNDLE=$(grep 'PRODUCT_BUNDLE_IDENTIFIER' $P | grep -v watchkitapp | head -1 | sed 's/.*= *//; s/;//')
          VERSION="${{ inputs.version }}"; [ -n "$VERSION" ] || VERSION=$(grep -m1 'MARKETING_VERSION' $P | sed 's/[^0-9.]//g')
          cd .github/scripts && python3 asc_prepare.py "$BUNDLE" "$VERSION" "$BUILD"
