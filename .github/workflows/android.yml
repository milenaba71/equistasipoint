# Compila l'app Android di Equistasi Point a ogni modifica.
# - Sempre: APK di prova (debug) da installare su un telefono Android.
# - Se nei secrets del repository c'è la chiave di firma: AAB firmato per Google Play.
name: App Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'css/**', 'js/**', 'img/**', 'manifest.webmanifest', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepara la web app per Android
        working-directory: mobile
        run: |
          npm ci
          npm run copy-web
          npx cap sync android

      - name: Compila l'APK di prova
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: equistasi-point-apk-prova
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Compila l'AAB firmato per Google Play
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/equistasi.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/equistasi.jks"
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('mobile/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: equistasi-point-aab-google-play
          path: mobile/android/app/build/outputs/bundle/release/*.aab
