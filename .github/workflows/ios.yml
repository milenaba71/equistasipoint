# Compila l'app iPhone di Equistasi Point e la carica su App Store Connect (TestFlight).
# Si avvia a mano: GitHub → Actions → "App iPhone" → Run workflow.
# Secrets necessari (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID          Team ID (developer.apple.com → Membership)
#   APPSTORE_KEY_ID        ID della chiave API di App Store Connect
#   APPSTORE_ISSUER_ID     Issuer ID della chiave API
#   APPSTORE_KEY_P8        contenuto del file AuthKey_XXXX.p8 (tutto il testo)
name: App iPhone

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Prepara la web app per iPhone
        working-directory: mobile
        run: |
          npm ci
          npm run copy-web
          npx cap sync ios

      - name: Chiave API di App Store Connect
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Verifica la chiave API (accesso ad App Store Connect)
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, jwt, urllib.request, urllib.error, sys
          key = open(os.environ["KEY_PATH"]).read()
          if not os.environ.get("ISSUER_ID") or not os.environ.get("KEY_ID"):
              print("::error::Manca APPSTORE_ISSUER_ID o APPSTORE_KEY_ID"); sys.exit(1)
          try:
              jwt.encode({}, key, algorithm="ES256")
          except Exception:
              print("::error::Il testo di APPSTORE_KEY_P8 non è una chiave valida: incolla tutto il file .p8, righe BEGIN/END comprese"); sys.exit(1)
          iss = os.environ["ISSUER_ID"]; kid = os.environ["KEY_ID"]
          # Solo indizi per il controllo, mai i valori completi
          print("Issuer ID: %d caratteri, inizia con %s, finisce con %s" % (len(iss), " ".join(iss[:4]), " ".join(iss[-4:])))
          print("Key ID: %d caratteri, inizia con %s" % (len(kid), " ".join(kid[:3])))
          print("Chiave .p8: %d righe, intestazione %s" % (len(key.strip().splitlines()), "ok" if key.strip().startswith("-----BEGIN PRIVATE KEY-----") else "MANCANTE"))
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=5", headers={"Authorization": "Bearer " + tok})
          try:
              with urllib.request.urlopen(req) as r:
                  print("Chiave API valida, HTTP", r.status)
          except urllib.error.HTTPError as e:
              print("::error::App Store Connect ha rifiutato la chiave API (HTTP %d): controlla APPSTORE_KEY_ID, APPSTORE_ISSUER_ID e APPSTORE_KEY_P8" % e.code)
              sys.exit(1)
          PY

      - name: Archivio firmato
        working-directory: mobile/ios/App
        run: |
          # Numero di build: l'ultima pubblicata su App Store Connect era la 20
          BUILD=$((20 + GITHUB_RUN_NUMBER))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$BUILD \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            archive

      - name: File IPA per App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: equistasi-point-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Carica su App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-app --type ios --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
