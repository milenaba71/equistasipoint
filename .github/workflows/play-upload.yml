# Compila l'app Android firmata e la carica su Google Play con la chiave di servizio (secret PLAY_SERVICE_ACCOUNT_JSON).
# Si avvia a mano: GitHub → Actions → "Google Play: carica" → Run workflow.
# - canale internal / alpha (test chiuso): la versione va subito ai tester;
# - canale production: resta in BOZZA su Play Console, salvo «Invia in revisione» (solo quando Milena lo decide):
#   allora la versione va subito in revisione da Google e dopo l'approvazione arriva a tutti.
name: "Google Play: carica"

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Canale: internal (test interno), alpha (test chiuso), production (resta in bozza)"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, production]
      review:
        description: "Solo produzione: invia subito in revisione (pubblicazione per tutti dopo l'approvazione di Google)"
        required: false
        default: false
        type: boolean

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepara la web app per Android
        working-directory: mobile
        run: |
          npm ci
          npm run copy-web
          npx cap sync android

      - name: Compila l'AAB firmato
        working-directory: mobile/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # numero di versione: decine di minuti dal 1° gennaio 2026, sempre crescente (uguale all'azione «App Android»)
          export VERSION_CODE=$(( ($(date +%s) - 1767225600) / 600 ))
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/equistasi.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/equistasi.jks"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/equistasi.jks"
          ls -la app/build/outputs/bundle/release/

      - name: Versione
        id: ver
        run: echo "name=$(grep -m1 'versionName' mobile/android/app/build.gradle | sed 's/[^0-9.]//g')" >> "$GITHUB_OUTPUT"

      - name: Note di rilascio
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          cp store/android-note.txt "$RUNNER_TEMP/notes/whatsnew-it-IT"

      - name: Carica su Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.equistasi.triggerpoint
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ (inputs.track != 'production' || inputs.review) && 'completed' || 'draft' }}
          releaseName: ${{ steps.ver.outputs.name }}
          whatsNewDirectory: ${{ runner.temp }}/notes
