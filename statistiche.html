<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Equistasi Point · Utilizzo settimanale</title>
  <style>
    :root { --navy: #23266f; --bg: #f3f5fa; --card: #fff; --txt: #161a33; --muted: #5d6480; --border: #e1e5ef; --bar: #2f3496; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { color: var(--navy); font-size: 1.5rem; margin: 0 0 4px; }
    .muted { color: var(--muted); font-size: .9rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-top: 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1 1 200px; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; text-transform: uppercase; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; cursor: pointer; }
    .big { font-size: 2.6rem; font-weight: 700; color: var(--navy); line-height: 1; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: .85rem; }
    td.n { font-variant-numeric: tabular-nums; font-weight: 600; }
    .bar { height: 8px; background: var(--bar); border-radius: 4px; margin-top: 4px; min-width: 2px; }
    .tags span { display: inline-block; background: #eef1fb; border-radius: 8px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: .85rem; }
    .err { color: #c8372d; }
  </style>
</head>
<body>
<main>
  <h1>Utilizzo dell'app</h1>
  <p class="muted">Persone diverse che hanno aperto Equistasi Point ogni settimana (da lunedì a domenica). Dati anonimi: un codice casuale per telefono.</p>
  <div class="card" id="login">
    <form id="f"><input id="code" autocomplete="off" placeholder="Codice di accesso" aria-label="Codice di accesso" /><button>Mostra</button></form>
    <p id="msg" class="muted" style="margin:8px 0 0"></p>
  </div>
  <div id="out"></div>
</main>
<script>
(function () {
  var URL_ = 'https://lxnntieqcumhjnvfbbgu.supabase.co/rest/v1/rpc/app_week_stats';
  var KEY = 'sb_publishable_TYFg4ICPgE_FSTCCYPf4Zg_AyvuPXrO';
  var NAMES = { prof: 'Noleggio prof', silicon: 'Silicon', gel: 'Gel', rent: 'Noleggio privato', nessuno: 'Senza dispositivo abbinato', ios: 'iPhone', android: 'Android', web: 'Sito' };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var get = function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  var put = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var fmt = function (d) { var p = d.split('-'); return p[2] + '/' + p[1]; };
  var plus6 = function (d) { var t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + 6); return ('0' + t.getDate()).slice(-2) + '/' + ('0' + (t.getMonth() + 1)).slice(-2); };
  var tags = function (o) { return Object.keys(o).sort(function (a, b) { return o[b] - o[a]; }).map(function (k) { return '<span>' + esc(NAMES[k] || k) + ': <b>' + o[k] + '</b></span>'; }).join(''); };

  function show(weeks) {
    var max = Math.max.apply(null, weeks.map(function (w) { return w.people; }).concat([1]));
    var cur = weeks[0], prev = weeks[1] || { people: 0 };
    document.getElementById('out').innerHTML =
      '<div class="card"><div class="muted">Questa settimana (' + fmt(cur.week) + ' – ' + plus6(cur.week) + ')</div><div class="big">' + cur.people + '</div>' +
      '<div class="muted">La settimana scorsa: ' + prev.people + '</div><div class="tags" style="margin-top:10px">' + tags(cur.kind) + '</div><div class="tags">' + tags(cur.platform) + '</div></div>' +
      '<div class="card"><table><thead><tr><th>Settimana</th><th>Persone</th><th>Dispositivi</th><th>Sistema</th></tr></thead><tbody>' +
      weeks.map(function (w) {
        return '<tr><td>' + fmt(w.week) + ' – ' + plus6(w.week) + '</td><td class="n">' + w.people + '<div class="bar" style="width:' + Math.round(w.people / max * 100) + '%"></div></td>' +
          '<td class="tags">' + tags(w.kind) + '</td><td class="tags">' + tags(w.platform) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  async function load(code) {
    var msg = document.getElementById('msg');
    msg.className = 'muted'; msg.textContent = 'Caricamento…';
    try {
      var r = await fetch(URL_, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: code }), cache: 'no-store' });
      var d = await r.json();
      if (!d || !d.ok) { msg.className = 'err'; msg.textContent = 'Codice non valido.'; put('eq-stats-code', ''); return; }
      put('eq-stats-code', code); msg.textContent = 'Aggiornato alle ' + new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      show(d.weeks || []);
    } catch (e) { msg.className = 'err'; msg.textContent = 'Connessione non riuscita. Riprova.'; }
  }
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); var c = document.getElementById('code').value.trim(); if (c) load(c); });
  var saved = get('eq-stats-code');
  if (saved) { document.getElementById('code').value = saved; load(saved); }
})();
</script>
</body>
</html>
